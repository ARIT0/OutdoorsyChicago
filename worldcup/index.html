    // Hashed UID — PIN never stored in plaintext in Firestore
    async function makeUID(name, pin) {
      const raw = name.trim().toLowerCase() + ":" + pin.trim();
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
      return "u_" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("").slice(0,24);
    }

            const map = {};
            snap.forEach(doc => {
              const d = { id: doc.id, ...doc.data() };
              if (!map[d.matchId]) map[d.matchId] = [];
              map[d.matchId].push(d);
            });
            setVenues(map);
          }, err => console.error("venues:", err));

        const unsubNames = db.collection("wc26_names")
          .onSnapshot(snap => {
            const m = {};
            snap.forEach(doc => { m[doc.id] = doc.data().name; });
            setNameMap(m);
          }, err => console.error("names:", err));

        return () => { unsubVenues(); unsubNames(); };
      }, []);

      // Derive plans from attendees array (no separate plans collection needed)
      const myPlans = {};
      if (userUID) {
        Object.entries(venues).forEach(([matchId, list]) => {
          const attending = list.find(v => (v.attendees||[]).includes(userUID));
          if (attending) myPlans[matchId] = attending.id;
        });
      }

      const handleSetIdentity = async (name, pin) => {
        const uid = await makeUID(name, pin);
        localStorage.setItem("wc26_uid",  uid);
        localStorage.setItem("wc26_name", name);
        await db.collection("wc26_names").doc(uid).set({ name });
        setUserUID(uid);
        setUserName(name);
        setNameSet(true);
      };

      const addVenue = async () => {
        if (!form.name.trim()) return;
        const matchVenues = venues[modal.matchId] || [];
        if (matchVenues.some(v => v.name.toLowerCase() === form.name.trim().toLowerCase())) {
          showFlash("⚠ Venue already listed!"); return;
        }
        try {
          await db.collection("wc26_venues").add({
            matchId: modal.matchId,
            name: form.name.trim(),
            address: form.address.trim(),
            limit: form.limit ? parseInt(form.limit) : null,
            votes: [userUID],
            attendees: [],
            createdBy: userUID,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          setModal(null); setForm({name:"", address:"", limit:""});
          showFlash("✓ Venue added!");
        } catch(e) { showFlash("⚠ Failed to save."); }
      };

      const deleteVenue = async (venueId) => {
        if (!window.confirm("Delete this venue? This cannot be undone.")) return;
        try {
          await db.collection("wc26_venues").doc(venueId).delete();

        } catch(e) { showFlash("⚠ Could not delete venue."); }
      };

      const vote = async (venueId, hasVoted) => {
        await db.collection("wc26_venues").doc(venueId).update({
          votes: hasVoted
            ? firebase.firestore.FieldValue.arrayRemove(userUID)
            : firebase.firestore.FieldValue.arrayUnion(userUID)
        });
      };

      const attend = async (matchId, venueId, isAttending, venue) => {
        if (!isAttending && venue.limit && (venue.attendees||[]).length >= venue.limit) {
          showFlash("🚫 Venue is full!"); return;
        }
        const currentVenueId = myPlans[matchId];

          await db.collection("wc26_venues").doc(currentVenueId).update({
            attendees: firebase.firestore.FieldValue.arrayRemove(userUID)

            <div className="howto-static-grid">
              <div className="howto-static-step"><span className="howto-static-icon">📅</span><div><strong>Browse the schedule</strong>Search by country or filter by round to find matches.</div></div>
              <div className="howto-static-step"><span className="howto-static-icon">📍</span><div><strong>Suggest a venue</strong>Tap any match to expand it, then "+ Suggest a Venue."</div></div>
              <div className="howto-static-step"><span className="howto-static-icon">★</span><div><strong>Vote for favorites</strong>Star any venue to upvote and help the group decide.</div></div>
              <div className="howto-static-step"><span className="howto-static-icon">✓</span><div><strong>Mark yourself going</strong>Hit "+ Going" to RSVP. Track plans in My Plans tab.</div></div>
              <div className="howto-static-step"><span className="howto-static-icon">🏅</span><div><strong>Top Venues tab</strong>See which bars are winning votes across all matches.</div></div>
              <div className="howto-static-step"><span className="howto-static-icon">🔑</span><div><strong>Name + PIN</strong>Same name &amp; PIN on any device restores all your choices.</div></div>
            </div>
          </div>

          <div className="tabs">
            {[["schedule","📅 Schedule"],["myplans","📌 My Plans"],["leaderboard","🏅 Top Venues"]].map(([id, label]) => (
              <button key={id} className={`tab${tab===id?" active":""}`} onClick={() => setTab(id)}>
                {label}
                {id==="myplans" && planMatches.length > 0 && <span className="tab-badge">{planMatches.length}</span>}
              </button>
            ))}
          </div>

          {tab === "schedule" && (
            <div className="content">
              <div className="filters">
                <input className="search-input" placeholder="🔍 Search team or country..." value={filterTeam} onChange={e => setFilterTeam(e.target.value)} />
                <div className="stage-filters">
                  {STAGES.map(s => (
                    <button key={s} className={`stage-btn${filterStage===s?" active":""}`}
                      style={filterStage===s ? {background: STAGE_COLORS[s]||"#2d7a2d", borderColor:"transparent"} : {}}
                      onClick={() => setFilterStage(s)}>{s}</button>
                  ))}
                </div>
              </div>
              {Object.entries(byDate).map(([date, matches]) => (
                <div key={date}>
                  <div className="date-header">{date}</div>
                  {matches.map(m => (
                    <MatchCard key={m.id} match={m}
                      venues={venues[m.id]||[]}
                      userUID={userUID}
                      resolveName={resolveName}
                      expanded={expanded === m.id}
                      onToggle={() => setExpanded(expanded===m.id ? null : m.id)}
                      onVote={vote}
                      onAttend={(vid, isAtt, v) => attend(m.id, vid, isAtt, v)}
                      onDelete={deleteVenue}
                      onAddVenue={() => { setModal({matchId: m.id}); setForm({name:"", address:"", limit:""}); }}
                    />
                  ))}
                </div>
              ))}
            </div>
          )}

          {tab === "myplans" && (
            <div className="content">
              <div className="section-title">📌 Your Watch Party Plans</div>
              {planMatches.length === 0
                ? <div className="empty-state"><div className="empty-icon">🍺</div>No plans yet!<br/>Browse the schedule and tap "+ Going" at any venue.</div>
                : planMatches.map(m => {
                    const vid = myPlans[m.id];
                    const v = (venues[m.id]||[]).find(x => x.id === vid);
                    return (
                      <div key={m.id} className="plan-card">
                        <span className="plan-stage" style={{background:(STAGE_COLORS[m.stage]||"#2d7a2d")+"33", color:STAGE_COLORS[m.stage]||"#2d7a2d"}}>{m.stage}</span>
                        <div className="plan-teams">{f(m.team1)} {m.team1} <span style={{color:"#444",fontWeight:400}}>vs</span> {f(m.team2)} {m.team2}</div>
                        <div className="plan-date">{m.date} · {m.time} CDT · {m.venue}</div>
                        {v
                          ? <div className="plan-venue">
                              <div className="plan-venue-name">📍 {v.name}</div>
                              {v.address && <div className="plan-venue-addr">{v.address}</div>}
                              <div className="plan-attend">👥 {(v.attendees||[]).length}{v.limit?`/${v.limit}`:""} attending</div>
                            </div>
                          : <div style={{color:"#555",fontSize:12}}>Venue removed</div>
                        }
                        <button className="cancel-plan" onClick={() => attend(m.id, vid, true, v||{})}>✕ Cancel plan</button>
                      </div>
                    );
                  })
              }
            </div>
          )}

          {tab === "leaderboard" && (
            <div className="content">
              <div className="section-title">🏅 Top Venues</div>

              {/* Subtabs */}
              <div className="subtabs">
                <button className={`subtab${leaderSub==="bymatch"?" active":""}`} onClick={() => setLeaderSub("bymatch")}>By Match</button>
                <button className={`subtab${leaderSub==="vibes"?" active":""}`} onClick={() => setLeaderSub("vibes")}>✨ Vibes Only</button>
              </div>

              {leaderSub === "bymatch" && (
                allVenues.length === 0
                  ? <div className="empty-state"><div className="empty-icon">🗳️</div>No venues suggested yet.<br/>Be the first to add one!</div>
                  : allVenues.slice(0,30).map((v, i) => (
                      <div key={v.id} className="leader-row">
                        <div className="leader-rank">{i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`}</div>
                        <div className="leader-info">
                          <div className="leader-venue-name">{v.name}</div>
                          {v.address && <div className="leader-addr">{v.address}</div>}
                          {v.match && <div className="leader-match">{v.match.team1} vs {v.match.team2} · {v.match.date} {v.match.time} CDT</div>}
                          <div className="leader-attend">👥 {(v.attendees||[]).length}{v.limit?`/${v.limit}`:""} attending</div>
                          {(v.votes||[]).length > 0 && <div className="leader-voters">Voted: {(v.votes||[]).map(resolveName).join(", ")}</div>}
                        </div>
                        <div className="leader-votes">{(v.votes||[]).length}</div>
                      </div>
                    ))
              )}

              {leaderSub === "vibes" && (() => {
                // Collapse all venues by name (case-insensitive), summing votes & attendees
                const vibeMap = {};
                allVenues.forEach(v => {
                  const key = v.name.trim().toLowerCase();
                  if (!vibeMap[key]) {
                    vibeMap[key] = { name: v.name, address: v.address || "", totalVotes: 0, totalAttending: 0, voters: new Set() };
                  }
                  vibeMap[key].totalVotes += (v.votes||[]).length;
                  vibeMap[key].totalAttending += (v.attendees||[]).length;
                  (v.votes||[]).forEach(uid => vibeMap[key].voters.add(uid));
                });
                const vibes = Object.values(vibeMap).sort((a,b) => b.totalVotes - a.totalVotes);
                return vibes.length === 0
                  ? <div className="empty-state"><div className="empty-icon">✨</div>No venues yet.<br/>Be the first to suggest one!</div>
                  : vibes.slice(0,30).map((v, i) => (
                      <div key={v.name} className="leader-row">
                        <div className="leader-rank">{i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`}</div>
                        <div className="leader-info">
                          <div className="leader-venue-name">{v.name}</div>
                          {v.address && <div className="leader-addr">{v.address}</div>}
                          <div className="leader-attend">👥 {v.totalAttending} attending across all matches</div>
                          {v.voters.size > 0 && <div className="leader-voters">Voted: {[...v.voters].map(resolveName).join(", ")}</div>}
                        </div>
                        <div className="leader-votes">{v.totalVotes}</div>
                      </div>
                    ));
              })()}
            </div>
          )}

          {modal && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-title">📍 Suggest a Venue</div>
                <input className="modal-input" placeholder="Bar / venue name *" autoFocus value={form.name} onChange={e => setForm({...form, name:e.target.value})} onKeyDown={e => e.key==="Enter" && addVenue()} />
                <input className="modal-input" placeholder="Address (optional)" value={form.address} onChange={e => setForm({...form, address:e.target.value})} />
                <input className="modal-input" placeholder="Person limit (optional)" type="number" min="1" value={form.limit} onChange={e => setForm({...form, limit:e.target.value})} />
                <p className="modal-hint">Your vote is automatically added when you suggest a venue.</p>
                <div className="modal-btns">
                  <button className="modal-cancel" onClick={() => setModal(null)}>Cancel</button>
                  <button className="modal-submit" onClick={addVenue}>Add Venue</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── PassGate ──────────────────────────────────────────────────────────────
    function PassGate({onUnlock}) {
      const [val,  setVal]  = useState("");
      const [err,  setErr]  = useState(false);
      const [show, setShow] = useState(false);
      const attempt = () => {
        if (val.trim().toLowerCase() === ACCESS_PASS.toLowerCase()) { onUnlock(); }
        else { setErr(true); setTimeout(() => setErr(false), 1800); }
      };
      return (
        <div className="gate">
          <div className="gate-card">
            <div className="gate-trophy">⚽</div>
            <h1 className="gate-title">FIFA World Cup 2026</h1>
            <p className="gate-sub">Chicago Watch Party · Members Only</p>
            <p className="gate-hint">Enter the group passphrase to continue</p>
            <div className="gate-input-wrap">
              <input className="gate-input" placeholder="Passphrase..." type={show ? "text" : "password"} value={val} autoFocus
                onChange={e => { setVal(e.target.value); setErr(false); }}
                onKeyDown={e => e.key==="Enter" && attempt()}
                style={err ? {borderColor:"#f44336"} : {}} />
              <button className="gate-eye" onClick={() => setShow(s => !s)} tabIndex={-1} aria-label="Toggle visibility">
                {show ? "🙈" : "👁"}
              </button>
            </div>
            {err && <div className="gate-error">Incorrect passphrase — try again</div>}
            <button className="gate-btn" onClick={attempt}>Enter →</button>
            <div className="gate-how">
              <div className="gate-how-title">How it works</div>
              <div className="gate-how-step"><span>🔑</span><span><strong>Passphrase</strong> — enter the shared group password to get in.</span></div>
              <div className="gate-how-step"><span>👤</span><span><strong>Name + PIN</strong> — pick a name and 4-digit PIN. Same combo on any device keeps your plans.</span></div>
              <div className="gate-how-step"><span>📍</span><span><strong>Suggest a venue</strong> — open any match and add a bar or spot to watch at.</span></div>
              <div className="gate-how-step"><span>★</span><span><strong>Vote &amp; RSVP</strong> — star favorites and hit "+ Going" to lock in your spot.</span></div>
              <div className="gate-how-step"><span>📌</span><span><strong>My Plans tab</strong> — all your RSVPs in one place, across every match.</span></div>
            </div>
          </div>
        </div>
      );
    }

    // ── NameGate ──────────────────────────────────────────────────────────────
    function NameGate({onSet}) {
      const [name,    setName]    = useState("");
      const [pin,     setPin]     = useState("");
      const [err,     setErr]     = useState("");
      const [busy,    setBusy]    = useState(false);
      const [showPin, setShowPin] = useState(false);

      const attempt = async () => {
        const n = name.trim();
        if (!n) { setErr("Please enter your name."); return; }
        if (pin.length < 4) { setErr("PIN must be exactly 4 digits."); return; }
        setBusy(true);
        await onSet(n, pin);
        setBusy(false);
      };

      return (
        <div className="gate">
          <div className="gate-card">
            <div className="gate-trophy">🏆</div>
            <h1 className="gate-title">FIFA World Cup 2026</h1>
            <p className="gate-sub">Chicago Watch Party Tracker</p>
            <p className="gate-hint">Pick a name and 4-digit PIN — use the same ones on any device to keep your plans in sync.</p>
            <input className="gate-input" placeholder="Your name..." value={name} autoFocus
              onChange={e => { setName(e.target.value); setErr(""); }}
              onKeyDown={e => e.key==="Enter" && attempt()} />
            <div className="gate-input-wrap">
              <input className="gate-input" placeholder="4-digit PIN" inputMode="numeric" pattern="[0-9]*"
                type={showPin ? "text" : "password"} value={pin}
                onChange={e => { setPin(e.target.value.replace(/\D/g,"").slice(0,4)); setErr(""); }}
                onKeyDown={e => e.key==="Enter" && attempt()} />
              <button className="gate-eye" onClick={() => setShowPin(s => !s)} tabIndex={-1} aria-label="Toggle PIN visibility">
                {showPin ? "🙈" : "👁"}
              </button>
            </div>
            {err && <div className="gate-error">{err}</div>}
            <button className="gate-btn" onClick={attempt} disabled={busy}>
              {busy ? "Setting up…" : "Let's Go →"}
            </button>
          </div>
        </div>
      );
    }

    // ── MatchCard ─────────────────────────────────────────────────────────────
    function MatchCard({match, venues, userUID, resolveName, expanded, onToggle, onVote, onAttend, onDelete, onAddVenue}) {
      const sc = STAGE_COLORS[match.stage] || "#2d7a2d";
      const sorted = [...venues].sort((a,b) => (b.votes||[]).length - (a.votes||[]).length);
      const top = sorted[0];
      const isGoingAny = venues.some(v => (v.attendees||[]).includes(userUID));

      return (
        <div className="match-card" style={{borderLeftColor: sc}}>
          <div className="match-header" onClick={onToggle}>
            <div className="match-teams">
              <span className="team-chip" style={{background:sc+"22", border:`1px solid ${sc}44`}}>{f(match.team1)} {match.team1}</span>
              <span className="vs-label">VS</span>
              <span className="team-chip" style={{background:sc+"22", border:`1px solid ${sc}44`}}>{f(match.team2)} {match.team2}</span>
            </div>
            <div className="match-meta">
              {match.group && <span className="group-tag">Group {match.group}</span>}
              <span className="time-tag">{match.time} CDT</span>
              {venues.length > 0 && <span className="venue-count">📍{venues.length}</span>}
              {isGoingAny && <span className="going-tag">✓ Going</span>}
            </div>
            <span className="expand-arrow">{expanded ? "▲" : "▼"}</span>
          </div>

          {!expanded && top && (
            <div className="top-preview">
              🏆 Top pick: <strong>{top.name}</strong> · {(top.votes||[]).length} vote{(top.votes||[]).length!==1?"s":""} · {(top.attendees||[]).length}{top.limit?`/${top.limit}`:""} going
            </div>
          )}

          {expanded && (
            <div className="venue-list">
              {sorted.length === 0 && <div className="no-venues">No venues suggested yet — add one below!</div>}
              {sorted.map((v, i) => {
                const hasVoted = (v.votes||[]).includes(userUID);
                const isAtt    = (v.attendees||[]).includes(userUID);
                const full     = v.limit && (v.attendees||[]).length >= v.limit && !isAtt;
                const isOwner  = userUID && v.createdBy === userUID;
                const attendeeNames = (v.attendees||[]).slice(0,6).map(resolveName);
                return (
                  <div key={v.id} className={`venue-row${i===0&&sorted.length>1?" top-venue":""}`}>
                    {i===0 && sorted.length>1 && <div className="top-badge">🏆 Top Pick</div>}
                    <div className="venue-info">
                      <span className="venue-name">{v.name}</span>
                      {v.address && <span className="venue-addr">{v.address}</span>}
                      <span className={`limit-badge${full?" limit-full":""}`}>
                        {full ? "🚫 Full" : `👥 ${(v.attendees||[]).length}${v.limit?`/${v.limit}`:""} going`}
                      </span>
                      {(v.attendees||[]).length > 0 && (
                        <span className="attendee-list">
                          {attendeeNames.join(", ")}{(v.attendees||[]).length>6?` +${(v.attendees||[]).length-6}`:""}
                        </span>
                      )}
                    </div>
                    <div className="venue-actions">
                      <button className={`vote-btn${hasVoted?" voted":""}`} onClick={() => onVote(v.id, hasVoted)}>
                        {hasVoted?"★":"☆"} {(v.votes||[]).length}
                      </button>
                      <button className={`going-btn${isAtt?" active":""}${full?" full":""}`}
                        onClick={() => !full && onAttend(v.id, isAtt, v)}>
                        {isAtt ? "✓ Going" : full ? "Full" : "+ Going"}
                      </button>
                      {isOwner && (
                        <button className="delete-venue-btn" onClick={() => onDelete(v.id)}>🗑 Delete</button>
                      )}
                    </div>
                  </div>
                );
              })}
              <button className="add-venue-btn" onClick={onAddVenue}>+ Suggest a Venue</button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <script>
    const wcHamburger = document.getElementById('wc-hamburger');
    const wcMenu = document.getElementById('wc-mobile-menu');
    wcHamburger.addEventListener('click', () => {
      wcHamburger.classList.toggle('open');
      wcMenu.classList.toggle('open');
    });
    wcMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        wcHamburger.classList.remove('open');
        wcMenu.classList.remove('open');
      });
    });

    function syncNavHeight() {
      const h = document.querySelector('.site-nav').getBoundingClientRect().height;
      document.documentElement.style.setProperty('--nav-h', h + 'px');
    }
    syncNavHeight();
    window.addEventListener('resize', syncNavHeight);
  </script>
</body>
</html>
